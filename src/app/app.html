<a class="skip" [href]="pagePath() + '#main'">Skip to content</a>
<header class="site-header">
  <div class="wrap nav-inner">
    <a class="brand" routerLink="/" aria-label="VIA Software Egypt home"
      ><svg
        class="logo-art"
        viewBox="299 253 1184 497"
        role="img"
        aria-label="VIA Software Egypt 3D logo"
      >
        <image
          href="/assets/via-3d-transparent.webp"
          width="1774"
          height="887"
          preserveAspectRatio="xMidYMid meet"
        /></svg
    ></a>
    <nav
      [class.open]="menuOpen()"
      (click)="closeMenu()"
      id="main-navigation"
      aria-label="Main navigation"
    >
      <a routerLink="/" fragment="work">Selected work</a
      ><a routerLink="/" fragment="expertise">Expertise</a
      ><a routerLink="/" fragment="about">About VIA</a
      ><a routerLink="/news" routerLinkActive="current" ariaCurrentWhenActive="page">News</a
      ><a class="connect-nav" routerLink="/" fragment="connect"
        >Connect
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 19 19 5M5 5h14v14" /></svg
      ></a>
    </nav>
    <button
      class="menu"
      (click)="toggleMenu()"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
    >
      <span></span><span></span>
    </button>
  </div>
</header>
<main id="main" tabindex="-1"><router-outlet /><via-connect /></main>
<footer class="footer">
  <div class="wrap footer-main">
    <a class="brand" routerLink="/"
      ><svg
        class="logo-art"
        viewBox="299 253 1184 497"
        role="img"
        aria-label="VIA Software Egypt 3D logo"
      >
        <image
          href="/assets/via-3d-transparent.webp"
          width="1774"
          height="887"
          preserveAspectRatio="xMidYMid meet"
        /></svg
    ></a>
    <p>Web, mobile and desktop applications.<br />Custom systems for the way businesses work.</p>
  </div>
  <div class="wrap footer-bottom">
    <span>© 2026 VIA Software Egypt</span><span>Software development · Egypt</span
    ><a routerLink="/news">News & project notes</a>
  </div>
</footer>
<via-project-dialog />
